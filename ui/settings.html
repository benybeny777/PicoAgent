<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>PicoAgent の設定</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <header>
    <h1>PicoAgent の設定</h1>
    <p class="hint">叩く AI とエージェント機能をここで設定できます。保存するとすぐ反映されます。</p>
    <label class="settings-search" for="settingsSearch">
      <span>検索</span>
      <input id="settingsSearch" type="search" autocomplete="off" placeholder="設定・スキル・キャラクターを探す" />
    </label>
  </header>

  <main id="form">
    <!-- セクションは settings.js が動的に描画する -->
    <p id="loading" class="hint">読み込み中…</p>
  </main>

  <footer>
    <span id="status" class="status" aria-live="polite"></span>
    <button id="save" type="button">保存</button>
  </footer>

  <datalist id="modelOptions"></datalist>
  <script src="picoagent.js"></script>
  <script src="settings.js"></script>
</body>
</html>
