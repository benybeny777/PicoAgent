<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>PicoAgent の設定</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <header>
    <h1>PicoAgent の設定</h1>
    <p class="hint">左から目的を選び、必要な項目だけ変更してください。変更内容は下の「保存」で反映します。</p>
    <label class="settings-search" for="settingsSearch">
      <span>設定を検索</span>
      <input id="settingsSearch" type="search" autocomplete="off" placeholder="例: 音声、画面、APIキー、キャラクター" />
      <button id="clearSettingsSearch" class="search-clear" type="button" hidden>解除</button>
    </label>
    <div class="search-shortcuts" role="group" aria-label="よく使う設定の検索">
      <span>すぐ探す</span>
      <button type="button" data-settings-query="画面">画面</button>
      <button type="button" data-settings-query="キャラクター">キャラ</button>
      <button type="button" data-settings-query="読み上げ">音声</button>
      <button type="button" data-settings-query="AI">AI</button>
      <button type="button" data-settings-query="APIキー">APIキー</button>
    </div>
  </header>

  <main id="form">
    <!-- セクションは settings.js が動的に描画する -->
    <p id="loading" class="hint">読み込み中…</p>
  </main>

  <footer>
    <span id="status" class="status" aria-live="polite"></span>
    <span id="dirtySummary" class="dirty-summary" aria-live="polite"></span>
    <button id="resetChanges" class="secondary" type="button" disabled>保存前の変更を取り消す</button>
    <button id="save" type="button" disabled>変更を保存</button>
  </footer>

  <datalist id="modelOptions"></datalist>
