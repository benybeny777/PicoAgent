<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PicoAgent</title>
  <link rel="stylesheet" href="styles.css?v=20260807-stream-layout2" />
</head>
<body>
  <main id="petApp" class="pet-app is-booting" data-tauri-drag-region>
    <section id="bootScreen" class="boot-screen" aria-live="polite" data-tauri-drag-region>
      <div class="boot-stage">
        <div id="bootLog" class="boot-log" aria-label="起動ログ"></div>
        <div class="boot-character">
          <img id="bootPetImage" alt="起動を待つキャラクター" draggable="false" />
          <span class="boot-shadow" aria-hidden="true"></span>
        </div>
        <div class="boot-progress" aria-hidden="true"><span></span></div>
        <div id="bootStatus" class="boot-status"></div>
      </div>
    </section>
    <section id="bubble" class="bubble" aria-live="polite">
      <div id="replyActions" class="reply-actions" aria-label="回答操作">
        <button id="noticeToggle" type="button" aria-label="アクションセンター" title="実行中・完了・通知">通知</button>
        <button id="copyReply" type="button" aria-label="回答をコピー" title="回答をコピー">コピー</button>
        <button id="regenReply" type="button" aria-label="別の答えを生成" title="同じ質問で別の答えを生成">再生成</button>
        <button id="replayReply" type="button" aria-label="もう一度読み上げ" title="もう一度読み上げ">読上</button>
        <button id="stopVoice" type="button" aria-label="読み上げを停止" title="読み上げを停止">停止</button>
        <button id="toggleFullscreen" type="button" aria-label="フキダシを拡大" title="フキダシを拡大">拡大</button>
      </div>
      <div id="noticePanel" class="notice-panel" hidden>
        <div class="notice-head">
          <span>アクションセンター</span>
          <button id="noticeClear" type="button">消去</button>
        </div>
        <div id="noticeList" class="notice-list"></div>
      </div>
      <div id="historyTools" class="history-tools" aria-label="会話履歴操作">
        <input id="historySearch" type="search" autocomplete="off" placeholder="履歴を検索" />
        <button id="exportHistory" type="button" title="会話をMarkdownで書き出し">書き出し</button>
      </div>
      <div id="historyLog" class="history-log" aria-label="会話履歴"></div>
      <!-- ウィジェット表示のときだけ出す時計。他の表示形式では CSS で隠す。 -->
      <div id="widgetClock" class="widget-clock" aria-hidden="true"><strong></strong><span></span></div>
      <div id="reply" class="reply">こんにちは。クリックして話しかけてね。</div>
      <form id="composer" class="composer" hidden>
        <div id="imagePreview" class="image-preview" hidden></div>
        <div id="attachmentSuggestions" class="attachment-suggestions" hidden aria-label="添付ファイルのおすすめ操作"></div>
        <div id="quickActions" class="quick-actions" aria-label="クイック操作"></div>
        <textarea id="input" rows="2" placeholder="話しかける… / 画像をペーストまたはドロップ"></textarea>
        <div class="composer-actions">
          <button id="voiceLoopButton" class="voice-loop-button" type="button" aria-pressed="false" title="返答後も自動で聞き続ける">連続</button>
          <button id="micButton" type="button" aria-label="音声入力" title="クリックで録音開始・停止 / 長押し中だけ録音">音声</button>
          <button id="sendButton" type="submit" aria-label="送信" title="Enter または Ctrl+Enter で送信 / Shift+Enterで改行 / ↑↓で入力履歴">送る</button>
        </div>
      </form>
      <div id="status" class="status"></div>
      <button id="cancelVoice" class="cancel-voice" type="button" hidden>読み上げを中止</button>
      <button id="cancelSend" class="cancel-send" type="button" hidden>処理を止める</button>
      <button id="bubbleResize" class="bubble-resize" type="button" aria-label="フキダシのサイズを変更" title="ドラッグしてサイズ変更"></button>
    </section>
    <section id="character" class="character" data-render-kind="2d" title="ドラッグで立ち絵を移動／右クリックで設定" role="button" tabindex="0" aria-label="キャラクターに触れる。ドラッグで立ち絵を移動、右クリックで設定">
      <!-- 立ち絵の拡大・移動はこの枠にかける。待機モーションは中の img を動かすので、
           同じ要素に transform を重ねないよう1枚挟んでいる。 -->
      <div id="characterView" class="character-view">
        <img id="petSprite" src="assets/characters/mugi/animations/idle/00.png" alt="むぎ" draggable="false" />
      </div>
      <span id="online" class="online"></span>
      <button id="relationshipButton" class="relationship-button" type="button" title="いっしょの記録を見る" aria-controls="relationshipCard" aria-expanded="false">♡</button>
    </section>
    <aside id="relationshipCard" class="relationship-card" role="dialog" aria-modal="false" aria-labelledby="relationshipLabel" hidden>
      <button id="relationshipClose" class="relationship-close" type="button" aria-label="閉じる">×</button>
      <div class="relationship-kicker">いっしょの記録</div>
      <strong id="relationshipLabel">出会ったばかり</strong>
      <div id="relationshipStats" class="relationship-stats"></div>
      <div id="relationshipMoments" class="relationship-moments"></div>
      <button id="relationshipClear" class="relationship-clear" type="button">記録をすべて消す</button>
      <label id="variantRow" class="variant-row" hidden>スタイル<select id="variantSelect"></select></label>
    </aside>
    <section id="onboarding" class="onboarding" hidden aria-modal="true" role="dialog" aria-labelledby="onboardingTitle">
      <div class="onboarding-card">
        <div class="onboarding-mark">PicoAgent</div>
        <h1 id="onboardingTitle">どんな相棒にする？</h1>
        <p>あとから設定で変えられます。まずは一番近いものを選んでね。</p>
        <div class="onboarding-choices">
          <button type="button" data-mode="life"><b>いっしょに暮らす</b><span>雑談や日々の出来事を大切に</span></button>
          <button type="button" data-mode="work"><b>いっしょに働く</b><span>調査や作業の完了をしっかり支援</span></button>
          <button type="button" data-mode="both"><b>どちらも</b><span>暮らしと仕事を自然に行き来</span></button>
        </div>
        <small>軽く、邪魔せず、必要なときにそっと手伝います。</small>
      </div>
    </section>
    <div class="window-resize-handles" aria-hidden="true">
      <span data-resize-direction="North"></span>
      <span data-resize-direction="East"></span>
      <span data-resize-direction="South"></span>
      <span data-resize-direction="West"></span>
      <span data-resize-direction="NorthEast"></span>
      <span data-resize-direction="SouthEast"></span>
      <span data-resize-direction="SouthWest"></span>
      <span data-resize-direction="NorthWest"></span>
    </div>
    <div id="dropOverlay" class="drop-overlay" hidden aria-hidden="true">
      <div class="drop-overlay-inner">📎 ここにドロップして添付</div>
    </div>
  </main>
  <script src="picoagent.js"></script>
  <script src="renderer.js?v=20260808-readable-layouts"></script>
</body>
</html>
