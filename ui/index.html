<!doctype html>
<html lang="ja" data-ui-theme="glass">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PicoAgent</title>
  <!-- テーマは ui/themes/<名前>/tokens.css。足すときはここへ1行と app/main.js の UI_THEMES へ名前を足す。 -->
  <link rel="stylesheet" href="themes/glass/tokens.css" />
  <link rel="stylesheet" href="themes/pastel/tokens.css" />
  <link rel="stylesheet" href="components/base.css" />
  <link rel="stylesheet" href="components/window.css" />
  <link rel="stylesheet" href="components/character.css" />
  <link rel="stylesheet" href="components/chat.css" />
  <link rel="stylesheet" href="components/stream.css" />
  <link rel="stylesheet" href="components/edit.css" />
  <link rel="stylesheet" href="components/boot.css" />
  <link rel="stylesheet" href="components/game.css" />
</head>
<body>
  <main id="petApp" class="app is-booting">
    <span class="beta-badge" aria-label="アルファ版" hidden>ALPHA</span>
    <section id="bootScreen" class="boot-screen" aria-live="polite"></section>
    <!-- シーン。ソース（キャラ・会話パネル・字幕…）は app/stage.js が置く。 -->
    <div id="stage" class="stage">
      <div id="sceneRoot" class="scene"></div>
    </div>
    <div id="editLayer" class="edit-layer" hidden></div>
    <section id="editToolbar" class="edit-toolbar" aria-label="配置の編集" hidden></section>
    <aside id="relationshipCard" class="relationship-card" role="dialog" aria-modal="false" aria-labelledby="relationshipLabel" hidden></aside>
    <!-- 初回案内はキャラクターモデル追加の1画面だけ。モデルは同梱・再配布せず、公式配布元へ案内する。 -->
    <section id="onboarding" class="onboarding" hidden aria-modal="true" role="dialog" aria-labelledby="onboardingCharacterTitle">
      <div class="onboarding-card">
        <div class="onboarding-mark">PicoAgent</div>
        <h1 id="onboardingCharacterTitle">キャラクターモデルを追加する？</h1>
        <p>公式サイトで配布されている無料モデルを取得するか、手元のモデルを追加できます。ダウンロード後はこの画面へ戻って追加してください。</p>
        <div class="onboarding-choices">
          <a class="onboarding-link" href="https://www.mmd.hololive.tv/" target="_blank" rel="noreferrer"><b>ホロライブ公式MMDを取得</b><span>利用規約と二次創作ガイドラインを確認してダウンロード</span></a>
          <a class="onboarding-link" href="https://www.live2d.com/learn/sample/" target="_blank" rel="noreferrer"><b>Live2D公式サンプル（桃瀬ひより など）を取得</b><span>利用条件を確認してダウンロード</span></a>
          <button type="button" data-onboarding-action="add-character"><b>取得したモデルをPicoAgentへ追加</b><span>zip／フォルダを選ぶ画面へ進む</span></button>
          <button type="button" data-onboarding-action="skip-character"><b>今はしない</b><span>いつでも「キャラ登録」から追加できます</span></button>
        </div>
        <p class="onboarding-component-note">音声入力・Office変換・PDF／画像／文書ツールは「設定 → 追加機能・更新」から導入できます。</p>
      </div>
    </section>
    <div id="dropOverlay" class="drop-overlay" hidden aria-hidden="true">
      <div class="drop-overlay-inner">📎 ここにドロップして添付</div>
    </div>
    <nav id="topWindowMenu" class="top-window-menu" aria-label="PicoAgent メニュー"></nav>
  </main>
  <section id="gameOverlay" class="game-overlay" role="dialog" aria-modal="true" aria-labelledby="gameTitle" hidden>
    <div class="game-shell">
      <header class="game-header">
        <div>
          <span class="game-kicker">人間だとバレるな</span>
          <h1 id="gameTitle">監査ブリーフィング</h1>
        </div>
        <div class="game-header-actions">
          <button id="gameSound" class="game-icon-button" type="button" aria-pressed="true" title="効果音を切り替え">音あり</button>
          <button id="gameClose" class="game-icon-button" type="button" aria-label="ゲームを閉じる">×</button>
        </div>
      </header>
      <div id="gameContent" class="game-content"></div>
      <div id="gameStatus" class="game-status" role="status" aria-live="polite"></div>
    </div>
  </section>
  <!-- 状態を持たない共通の道具（設定画面・Node のテストと共有する）。 -->
  <script src="picoagent.js"></script>
  <script src="common.js"></script>
  <script src="frame-scheduler.js"></script>
  <script src="composer-draft.js"></script>
  <script src="quick-actions.js"></script>
  <script src="alarm-runtime.js"></script>
  <script src="task-run.js"></script>
  <script src="mesh-rig.js"></script>
  <!-- メイン画面の入口。以降は ES Modules で、Tauri を呼ぶのは app/bridge.js だけ。 -->
  <script type="module" src="app/main.js"></script>
</body>
</html>
