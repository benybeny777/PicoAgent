<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PicoAgent</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="petApp" class="pet-app is-booting" data-tauri-drag-region>
    <section id="bootScreen" class="boot-screen" aria-live="polite" data-tauri-drag-region>
      <div class="boot-stage">
        <div id="bootLog" class="boot-log" aria-label="起動ログ"></div>
        <div class="boot-character">
          <img id="bootPetImage" alt="起動を待つキャラクター" draggable="false" />
          <span class="boot-shadow" aria-hidden="true"></span>
        </div>
        <div class="boot-progress" aria-hidden="true"><span></span></div>
        <div id="bootStatus" class="boot-status"></div>
      </div>
    </section>
    <section id="bubble" class="bubble" aria-live="polite">
      <div id="replyActions" class="reply-actions" aria-label="回答操作">
        <button id="noticeToggle" type="button" aria-label="通知一覧" title="通知一覧">!</button>
        <button id="copyReply" type="button" aria-label="回答をコピー" title="回答をコピー">C</button>
        <button id="replayReply" type="button" aria-label="もう一度読み上げ" title="もう一度読み上げ">↻</button>
        <button id="stopVoice" type="button" aria-label="読み上げを停止" title="読み上げを停止">■</button>
        <button id="toggleFullscreen" type="button" aria-label="フキダシを拡大" title="フキダシを拡大">□</button>
      </div>
      <div id="noticePanel" class="notice-panel" hidden>
        <div class="notice-head">
          <span>通知</span>
          <button id="noticeClear" type="button">消去</button>
        </div>
        <div id="noticeList" class="notice-list"></div>
      </div>
      <div id="historyTools" class="history-tools" aria-label="会話履歴操作">
        <input id="historySearch" type="search" autocomplete="off" placeholder="履歴を検索" />
      </div>
      <div id="historyLog" class="history-log" aria-label="会話履歴"></div>
      <div id="reply" class="reply">こんにちは。クリックして話しかけてね。</div>
      <form id="composer" class="composer" hidden>
        <div id="imagePreview" class="image-preview" hidden></div>
        <div id="quickActions" class="quick-actions" aria-label="クイック操作"></div>
        <textarea id="input" rows="2" placeholder="話しかける… / 画像をペーストまたはドロップ"></textarea>
        <button id="sendButton" type="submit" aria-label="送信" title="Enter または Ctrl+Enter で送信 / Shift+Enterで改行 / ↑↓で入力履歴">送る</button>
      </form>
      <div id="status" class="status"></div>
      <button id="bubbleResize" class="bubble-resize" type="button" aria-label="フキダシのサイズを変更" title="ドラッグしてサイズ変更"></button>
    </section>
    <section id="character" class="character" title="右クリックで設定" data-tauri-drag-region>
      <img id="petSprite" src="assets/characters/mugi/animations/idle/00.png" alt="むぎ" draggable="false" />
      <span id="online" class="online"></span>
    </section>
  </main>
  <script src="picoagent.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
