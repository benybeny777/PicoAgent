# xtask - 開発・ビルド用のタスクランナー（旧 scripts/*.mjs の置き換え）。
#
# Node を使わずに同梱物の取得・UI ビルド・キャラ同期・残存プロセス停止・
# ローカル API CLI を行う。`cargo xtask <サブコマンド>` で実行する
# （エイリアスは リポジトリ直下の .cargo/config.toml）。
[package]
name = "xtask"
version = "1.2.5"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
serde_json = "1"
# rustls を使いつつ、ルート証明書は**システムの信頼ストア**から読む。
# 社内プロキシなどで独自 CA を使う環境でも、SSL_CERT_FILE / OS の設定がそのまま効く
# （webpki 同梱ルートだけだと、そうした環境で取得が必ず失敗する）。
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
sha2 = "0.11"
hex = "0.4"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
base64 = "0.23"
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
# 実行画像のlossless WebPに加え、制作正本PNGを画素単位で検査する品質ゲート
# （character_quality.rs）がPNG復号を使う。
image = { version = "0.25.10", default-features = false, features = ["webp", "png"] }

# 高精細画像のlossless WebP圧縮はデバッグ最適化なしだと起動前処理として遅すぎる。
# xtask本体のデバッグ情報は保ち、画像処理依存だけをリリース相当でコンパイルする。
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

# 制作正本PNGの復号（品質ゲート）も同じ理由で最適化する。
# 1780x3600の9レイヤーをデバッグ最適化なしで復号すると検査だけで分単位になる。
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.moxcms]
opt-level = 3

[profile.dev.package.pxfm]
opt-level = 3
