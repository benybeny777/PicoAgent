# xtask - 開発・ビルド用のタスクランナー（旧 scripts/*.mjs の置き換え）。
#
# Node を使わずに同梱物の取得・UI ビルド・キャラ同期・残存プロセス停止・
# ローカル API CLI を行う。`cargo xtask <サブコマンド>` で実行する
# （エイリアスは リポジトリ直下の .cargo/config.toml）。
[package]
name = "xtask"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
serde_json = "1"
# rustls を使いつつ、ルート証明書は**システムの信頼ストア**から読む。
# 社内プロキシなどで独自 CA を使う環境でも、SSL_CERT_FILE / OS の設定がそのまま効く
# （webpki 同梱ルートだけだと、そうした環境で取得が必ず失敗する）。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
