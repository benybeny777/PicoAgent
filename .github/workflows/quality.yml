name: 品質確認

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            xtask -> target
      - name: Linuxビルド依存を導入
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev
      - name: UIとキャラクターを同期
        run: |
          cargo xtask sync-characters
          cargo xtask build-ui
      - name: フォーマット確認
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path xtask/Cargo.toml --check
      - name: コンパイル確認
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: clippy警告ゼロ確認
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Windows全テスト
        if: runner.os == 'Windows'
        run: |
          cargo test --lib --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path xtask/Cargo.toml
      - name: macOS主要テスト
        if: runner.os == 'macOS'
        run: |
          cargo test --lib --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path xtask/Cargo.toml
      - name: Linux未対応スタブ確認
        if: runner.os == 'Linux'
        run: cargo test --manifest-path xtask/Cargo.toml
