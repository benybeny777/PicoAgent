name: Rust依存脆弱性確認

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "17 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: ${{ matrix.lockfile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lockfile:
          - src-tauri/Cargo.lock
          - xtask/Cargo.lock
          - crates/picoagent-core/Cargo.lock
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cargo/bin
          shared-key: cargo-audit
      - name: cargo-auditを導入
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
      - name: 既知の脆弱性を確認
        run: cargo audit --file "${{ matrix.lockfile }}"
