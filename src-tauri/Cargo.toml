[package]
name = "picoagent"
version = "1.2.4"
description = "PicoAgent - コネクタ駆動のデスクトップペット"
authors = ["PicoAgent"]
edition = "2021"
rust-version = "1.88"
publish = false

[features]
# 開発中アルファだけでPro対象スキルを試用可能にする。正式版はこのfeatureを付けない。
beta-full = []

[lib]
name = "picoagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
picoagent-core = { version = "0.1.0", path = "../crates/picoagent-core" }
picoagent-character-maker = { version = "0.1.0", path = "../character-maker" }
# protocol-asset: 追加キャラクター（app_data_dir 配下）を webview から読ませる asset プロトコル。
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset"] }
# 設定画面から「キャラクターパックを選ぶ」ためのネイティブダイアログ（Rust API のみ利用）。
tauri-plugin-dialog = "2"
# 他のアプリの裏に居ても呼び出すためのグローバルホットキー（Rust API のみ利用。hotkey.rs）。
tauri-plugin-global-shortcut = "2"
# 多重起動の防止。2つ目の起動は既存ウィンドウを前面へ出して終了する。
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: JSONを読み書きするときにキーの並びを保つ（`character.json` の名前変更など、
# 利用者が作ったファイルを再保存しても並べ替えで差分を出さないため）。
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "form", "rustls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "net", "io-util"] }
# ブラウザ操作（browser_control）の CDP は WebSocket。接続先は 127.0.0.1 の ws:// 固定なので TLS 機能は入れない。
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures = "0.3"
async-trait = "0.1"
inventory = "0.3"
chrono = "0.4"
chrono-tz = "0.10"
dirs = "6"
anyhow = "1"
scraper = "0.27"
url = "2"
base64 = "0.23"
ed25519-dalek = "3"
feed-rs = "2.4"
encoding_rs = "0.8"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
sha2 = "0.11"
hex = "0.4"
calamine = { version = "0.36", default-features = false, features = ["dates"] }
cpal = "0.18"
hound = "3.5"
enigo = "0.6"
arboard = { version = "3.6.1", default-features = false }
tempfile = "3"

# 画面取得。Windows / macOS / Linux で外部コマンドを介さず取得する。
# Linux のビルドには X11 / Wayland / PipeWire の開発ヘッダが必要。
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
xcap = "0.9.8"

[target.'cfg(target_os = "macos")'.dependencies]
# シークレット（APIキー等）をログインキーチェーンへ預けるために使用する。
# rustls 経由で既に依存グラフへ入っているため、直接依存にしても追加のクレートは増えない。
security-framework = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# シークレット（APIキー等）の DPAPI 暗号化に使用する。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    # 総メモリ量・GPU 名の取得（PowerShell 経由の WMI 問い合わせを置き換える）。
    "Win32_System_SystemInformation",
    "Win32_Graphics_Gdi",
    # 表示アダプタのクラスキーから専用VRAM量とPCIベンダーIDを読む（gpu.rs）。
    "Win32_System_Registry",
    # ウィンドウ一覧・前面化（desktop_control）。
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
# Linux の実行ファイルと cdylib をfat LTOで同時に作ると、encoding_rsの公開定数が
# 未解決になりリンクできない。全OSで最適化を維持できるthin LTOを使う。
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
