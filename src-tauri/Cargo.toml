[package]
name = "picoagent"
version = "1.0.0"
description = "PicoAgent - コネクタ駆動のデスクトップペット"
authors = ["PicoAgent"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "picoagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "net", "io-util"] }
# ブラウザ操作（browser_control）の CDP は WebSocket。接続先は 127.0.0.1 の ws:// 固定なので TLS 機能は入れない。
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures = "0.3"
async-trait = "0.1"
inventory = "0.3"
chrono = "0.4"
chrono-tz = "0.10"
dirs = "5"
anyhow = "1"
scraper = "0.20"
url = "2"
base64 = "0.22"
feed-rs = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
calamine = { version = "0.24", default-features = false, features = ["dates"] }
cpal = "0.15"
hound = "3.5"
enigo = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# シークレット（APIキー等）の DPAPI 暗号化に使用する。
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
