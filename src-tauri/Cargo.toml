[package]
name = "picoagent"
version = "1.0.0"
description = "PicoAgent - コネクタ駆動のデスクトップペット"
authors = ["PicoAgent"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "picoagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
futures = "0.3"
async-trait = "0.1"
inventory = "0.3"
chrono = "0.4"
chrono-tz = "0.10"
dirs = "5"
anyhow = "1"
scraper = "0.20"
url = "2"
base64 = "0.22"
feed-rs = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
