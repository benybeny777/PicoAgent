<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PicoAgent 動画比較</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="eyebrow">LOCAL QA</p>
      <h1>現在のキャラクター動画</h1>
      <p>通常表示と配信表示を並べて確認できます。カードをクリックすると拡大します。</p>
      <a class="page-link" href="parts.html">キャラクター画像パーツを見る →</a>
    </div>
    <div class="summary" aria-live="polite"><strong id="visibleCount">0</strong><span>本を表示</span></div>
  </header>

  <nav class="filters" aria-label="表示フィルター">
    <button type="button" class="is-active" data-filter="all">すべて</button>
    <button type="button" data-filter="standard">通常表示</button>
    <button type="button" data-filter="stream">配信表示</button>
    <label><span>キャラ検索</span><input id="search" type="search" placeholder="むぎ、実写、Live2D…"></label>
  </nav>

  <main id="gallery" class="gallery" aria-live="polite"></main>

  <dialog id="detail" class="detail">
    <button id="closeDetail" class="close" type="button" aria-label="閉じる">×</button>
    <button id="previous" class="step previous" type="button" aria-label="前の動画">‹</button>
    <figure>
      <img id="detailImage" alt="">
      <figcaption><strong id="detailTitle"></strong><span id="detailMeta"></span></figcaption>
    </figure>
    <button id="next" class="step next" type="button" aria-label="次の動画">›</button>
  </dialog>

  <script src="gallery.js"></script>
</body>
</html>
