[project]
name = "picoagent-mugi-vrm-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  "psd-tools>=1.14,<2",
  "scipy>=1.14,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
