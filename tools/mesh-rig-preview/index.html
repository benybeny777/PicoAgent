<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>PicoAgent 2.5D確認</title>
  <style>
    :root { color-scheme: dark; font-family: "Yu Gothic UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; background: #11131a; color: #eef1fa; }
    header { max-width: 1180px; margin: 0 auto 14px; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 4px 0; color: #bac2d8; }
    main { max-width: 1180px; margin: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    section { border: 1px solid #343b50; border-radius: 14px; overflow: hidden; background: #1a1e29; }
    section h2 { font-size: 15px; margin: 0; padding: 11px 14px; background: #242a39; }
    .stage { position: relative; height: min(72vh, 760px); min-height: 520px; display: grid; place-items: center; overflow: hidden; }
    .checker { background-color: #c7c7c7; background-image: linear-gradient(45deg,#999 25%,transparent 25%),linear-gradient(-45deg,#999 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#999 75%),linear-gradient(-45deg,transparent 75%,#999 75%); background-size: 24px 24px; background-position: 0 0,0 12px,12px -12px,-12px 0; }
    .dark { background: #090a0e; }
    .light { background: #f6f7fb; }
    canvas { width: 100% !important; height: 100% !important; object-fit: contain; }
    #source { max-width: 100%; max-height: 100%; object-fit: contain; }
    .controls { max-width: 1180px; margin: 14px auto 0; display: grid; gap: 10px; }
    .control-group { padding: 11px 12px; border: 1px solid #343b50; border-radius: 12px; background: #1a1e29; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .control-group h2 { width: 92px; margin: 0; font-size: 14px; color: #9ed5ff; }
    button, select { border: 1px solid #48516a; border-radius: 8px; background: #2a3040; color: #fff; padding: 8px 12px; cursor: pointer; }
    button:hover { background: #39425a; }
    label { display: flex; align-items: center; gap: 7px; padding: 0 6px; }
    input[type=range] { width: 128px; }
    output { min-width: 34px; color: #9ed5ff; font-variant-numeric: tabular-nums; }
    .active { border-color: #74c5ff; background: #31516b; }
    #status { max-width: 1180px; margin: 10px auto; color: #9ed5ff; }
    #quality:not(:empty) { max-width: 1180px; margin: 10px auto; padding: 10px 12px; border: 1px solid #a76836; border-radius: 10px; background: #392719; color: #ffd1a8; }
    @media (max-width: 760px) {
      body { padding: 10px; }
      main { grid-template-columns: 1fr; }
      .stage { height: 62vh; min-height: 430px; }
      .control-group { align-items: stretch; }
      .control-group h2 { width: 100%; }
      button, select { min-height: 42px; }
      label { flex: 1 1 210px; justify-content: space-between; }
      input[type=range] { flex: 1; min-width: 90px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>PicoAgent独自2.5D 実描画確認</h1>
    <p>右はPicoAgent本番の <code>mesh-rig.js + PIXI</code>。Live2D/Cubismは使っていません。</p>
  </header>
  <main>
    <section><h2>立ち絵原画</h2><div class="stage checker"><img id="source" alt="立ち絵原画"></div></section>
    <section><h2>PicoAgent描画</h2><div id="runtimeStage" class="stage checker"></div></section>
  </main>
  <div class="controls" aria-label="2.5D確認操作">
    <div class="control-group">
      <h2>表示</h2>
      <label>キャラクター
        <select id="character">
          <option value="female-a">女性A</option>
          <option value="mugi">むぎ（SD）</option>
          <option value="mugi-normal">むぎ（通常頭身）</option>
          <option value="photoreal">実写テスト</option>
        </select>
      </label>
      <button id="view">全身で腕を見る</button>
      <button data-bg="checker">市松</button><button data-bg="dark">黒</button><button data-bg="light">白</button>
    </div>
    <div class="control-group">
      <h2>目・視線</h2>
      <button id="blink">両目まばたき</button>
      <button data-wink="L">左目</button><button data-wink="R">右目</button>
      <label>左右 <input id="gazeX" type="range" min="-1" max="1" step="0.05" value="0"><output>0.00</output></label>
      <label>上下 <input id="gazeY" type="range" min="-1" max="1" step="0.05" value="0"><output>0.00</output></label>
      <button id="gazeReset">視線を中央へ</button>
    </div>
    <div class="control-group">
      <h2>口</h2>
      <button data-mouth="0,0">閉口</button>
      <button data-mouth="1,0">あ</button>
      <button data-mouth="0.38,0.95">い</button>
      <button data-mouth="0.55,-0.95">う</button>
      <button data-mouth="0.62,0.70">え</button>
      <button data-mouth="0.90,-0.75">お</button>
      <button id="demo">口・目の自動確認</button>
    </div>
    <div class="control-group">
      <h2>表情</h2>
      <button data-expression="neutral">通常</button>
      <button data-expression="happy">笑顔</button>
      <button data-expression="concern">困り顔</button>
      <button data-expression="thinking">考え顔</button>
      <button data-expression="shy">照れ</button>
    </div>
    <div class="control-group">
      <h2>動作</h2>
      <button data-motion="idle">待機</button>
      <button data-motion="talking">会話</button>
      <button data-motion="thinking">考え中</button>
      <button data-motion="success">よろこび</button>
      <button data-motion="concern">困り</button>
      <button data-motion="listen">聞く</button>
      <button data-motion="wake">起きる</button>
      <button data-motion="sleep">眠る</button>
      <button id="motionDemo">全動作を自動確認</button>
    </div>
    <div class="control-group">
      <h2>姿勢</h2>
      <label>腕を体へ寄せる <input id="arm" type="range" min="0" max="1" step="0.01" value="0"><output>0.00</output></label>
    </div>
  </div>
  <div id="quality" role="status"></div>
  <div id="status">読込中…</div>
  <script src="../../ui/vendor/pixi/pixi.min.js"></script>
  <script src="../../ui/mesh-rig.js?v=20260909-arm-residual-1"></script>
  <script>
    "use strict";
    const query = new URLSearchParams(location.search);
    const packs = {
      "female-a": {
        root: "/characters/female-a-lvs",
        source: "preview.png",
      },
      mugi: { root: "/characters/mugi", source: "preview.png" },
      "mugi-normal": { root: "/characters/mugi-normal-lvs", source: "source.png" },
      photoreal: { root: "/characters/photoreal-prototype", source: "preview.png" },
    };
    const initialCharacter = query.get("character") || "female-a";
    const status = document.getElementById("status");
    let controller = null;
    let demoGeneration = 0;
    let motionGeneration = 0;
    let blinkTimer = 0;
    let talkingTimer = 0;
    let currentRigMode = "";
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

    function stopTalkingPreview() {
      window.clearInterval(talkingTimer);
      talkingTimer = 0;
    }

    function setMotionPreview(name) {
      stopTalkingPreview();
      controller?.setMotion(name);
      if (name !== "talking") {
        controller?.setMouth(0, 0);
        return;
      }
      const vowels = [[0.72, 0], [0.28, 0.9], [0.58, -0.8], [0, 0], [0.88, -0.55], [0, 0]];
      let index = 0;
      talkingTimer = window.setInterval(() => {
        controller?.setMouth(...vowels[index % vowels.length]);
        index += 1;
      }, 145);
    }

    async function blink() {
      if (!controller) return;
      controller.setBlink(0, 180); await wait(180);
      controller.setEyeOpen(0, 0); await wait(220);
      controller.setBlink(1, 250);
    }
    async function wink(side) {
      if (!controller || !["anime25d-v1", "lvs-anime25d-v1"].includes(currentRigMode)) return;
      const left = side === "L" ? 0 : 1;
      const right = side === "R" ? 0 : 1;
      controller.setEyeOpen(left, right);
      await wait(420);
      controller.setEyeOpen(1, 1);
    }
    async function demo() {
      const generation = ++demoGeneration;
      stopTalkingPreview();
      const vowels = [[0, 0], [1, 0], [0, 0], [0.38, 0.95], [0, 0],
        [0.55, -0.95], [0, 0], [0.62, 0.70], [0, 0], [0.90, -0.75], [0, 0]];
      await blink();
      for (const [open, form] of vowels) {
        if (generation !== demoGeneration) return;
        controller.setMouth(open, form); await wait(open ? 620 : 190);
      }
    }
    async function motionDemo() {
      const generation = ++motionGeneration;
      const sequence = [
        ["thinking", "考え中", 2800],
        ["talking", "会話", 3600],
        ["success", "よろこび", 2800],
        ["concern", "困り", 2800],
        ["listen", "聞く", 2400],
        ["wake", "起きる", 2400],
        ["sleep", "眠る", 2800],
        ["idle", "待機", 2200],
      ];
      for (const [name, label, duration] of sequence) {
        if (generation !== motionGeneration) return;
        setMotionPreview(name);
        status.textContent = `動作の自動確認 — ${label}`;
        await wait(duration);
      }
      stopTalkingPreview();
      controller?.setMouth(0, 0);
    }
    async function loadCharacter(characterId) {
      const pack = packs[characterId] || packs["female-a"];
      const packRoot = pack.root;
      demoGeneration += 1;
      motionGeneration += 1;
      stopTalkingPreview();
      window.clearInterval(blinkTimer);
      controller?.destroy();
      controller = null;
      const canvas = document.createElement("canvas");
      canvas.id = "runtime";
      canvas.setAttribute("aria-label", "PicoAgent 2.5D描画");
      document.getElementById("runtimeStage").appendChild(canvas);
      status.textContent = "読込中…";
      document.getElementById("quality").textContent = pack.warning || "";
      const manifestResponse = await fetch(`${packRoot}/character.json`);
      if (!manifestResponse.ok) throw new Error(`character.json: HTTP ${manifestResponse.status}`);
      const manifest = await manifestResponse.json();
      const rigResponse = await fetch(`${packRoot}/${manifest.meshRig.rig}`);
      if (!rigResponse.ok) throw new Error(`rig.json: HTTP ${rigResponse.status}`);
      const rig = await rigResponse.json();
      currentRigMode = rig.profile || rig.mode;
      const rigWidth = Array.isArray(rig.canvas) ? rig.canvas[0] : rig.canvas.width;
      const rigHeight = Array.isArray(rig.canvas) ? rig.canvas[1] : rig.canvas.height;
      const rigRoot = manifest.meshRig.rig.includes("/")
        ? manifest.meshRig.rig.slice(0, manifest.meshRig.rig.lastIndexOf("/")) : ".";
      document.getElementById("source").src = `${packRoot}/${pack.source}`;
      controller = await window.PicoMeshRig.create({
        canvas,
        rigUrl: `${packRoot}/${manifest.meshRig.rig}`,
        rootUrl: `${packRoot}/${rigRoot}`,
        assetVersion: manifest.meshRig.assetVersion || manifest.assetVersion,
        width: 540,
        height: 760,
        contentBox: query.get("view") === "full" ? [0, 0, rigWidth, rigHeight] : undefined,
      });
      controller.setActive(true);
      controller.setArmClose(Number(document.getElementById("arm").value));
      controller.setGaze(Number(document.getElementById("gazeX").value), Number(document.getElementById("gazeY").value));
      const independentEyes = ["anime25d-v1", "lvs-anime25d-v1"].includes(currentRigMode);
      document.querySelectorAll("[data-wink]").forEach(button => {
        button.disabled = !independentEyes;
        button.title = independentEyes ? "片目を閉じます" : "この旧パックは両目共通の閉眼差分です";
      });
      document.getElementById("arm").disabled = !independentEyes;
      status.textContent = `${manifest.name} — ${rigWidth}×${rigHeight}座標を本番と同じ経路で描画中。${independentEyes ? "左右目・5母音・表情・腕・全動作を個別確認できます" : "旧パックのため目は両目共通、腕寄せは対象外です"}`;
      if (query.get("autoBlink") !== "off") {
        blinkTimer = window.setInterval(() => { if (document.visibilityState === "visible") blink(); }, 4200);
      }
    }
    async function main() {
      const selector = document.getElementById("character");
      selector.value = packs[initialCharacter] ? initialCharacter : "female-a";
      await loadCharacter(selector.value);
    }
    document.querySelectorAll("[data-mouth]").forEach(button => button.addEventListener("click", () => {
      demoGeneration += 1;
      stopTalkingPreview();
      const [open, form] = button.dataset.mouth.split(",").map(Number);
      controller?.setMouth(open, form);
    }));
    document.getElementById("blink").addEventListener("click", blink);
    document.querySelectorAll("[data-wink]").forEach(button => button.addEventListener("click", () => wink(button.dataset.wink)));
    document.getElementById("demo").addEventListener("click", demo);
    document.getElementById("motionDemo").addEventListener("click", motionDemo);
    document.querySelectorAll("[data-expression]").forEach(button => button.addEventListener("click", () => {
      controller?.setExpression(button.dataset.expression);
      document.querySelectorAll("[data-expression]").forEach(item => item.classList.toggle("active", item === button));
      status.textContent = `${document.getElementById("character").selectedOptions[0].textContent} — ${button.textContent}を確認中`;
    }));
    document.querySelectorAll("[data-motion]").forEach(button => button.addEventListener("click", () => {
      motionGeneration += 1;
      setMotionPreview(button.dataset.motion);
      document.querySelectorAll("[data-motion]").forEach(item => item.classList.toggle("active", item === button));
      status.textContent = `${document.getElementById("character").selectedOptions[0].textContent} — ${button.textContent}動作を確認中`;
    }));
    document.getElementById("view").addEventListener("click", () => {
      query.set("view", query.get("view") === "full" ? "bust" : "full");
      location.search = query.toString();
    });
    document.getElementById("arm").addEventListener("input", event => {
      event.target.nextElementSibling.value = event.target.value;
      controller?.setArmClose(Number(event.target.value));
    });
    function updateGaze() {
      const x = Number(document.getElementById("gazeX").value);
      const y = Number(document.getElementById("gazeY").value);
      document.querySelector("#gazeX + output").value = x.toFixed(2);
      document.querySelector("#gazeY + output").value = y.toFixed(2);
      controller?.setGaze(x, y);
    }
    document.getElementById("gazeX").addEventListener("input", updateGaze);
    document.getElementById("gazeY").addEventListener("input", updateGaze);
    document.getElementById("gazeReset").addEventListener("click", () => {
      document.getElementById("gazeX").value = "0";
      document.getElementById("gazeY").value = "0";
      updateGaze();
    });
    document.querySelectorAll("[data-bg]").forEach(button => button.addEventListener("click", () => {
      document.querySelectorAll(".stage").forEach(stage => stage.className = `stage ${button.dataset.bg}`);
    }));
    document.getElementById("character").addEventListener("change", event => {
      query.set("character", event.target.value);
      history.replaceState(null, "", `${location.pathname}?${query}`);
      loadCharacter(event.target.value).catch(error => {
        status.textContent = `表示失敗: ${error.message}`;
        console.error(error);
      });
    });
    main().catch(error => { status.textContent = `表示失敗: ${error.message}`; console.error(error); });
  </script>
</body>
</html>
